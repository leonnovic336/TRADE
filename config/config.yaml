# AI-Powered Trading Bot Configuration
# Copy this to config.yaml and fill in your API keys

# API Keys for Data Sources
data_sources:
  # News & Sentiment APIs
  news_api_key: "YOUR_NEWS_API_KEY"  # newsapi.org
  finnhub_api_key: "YOUR_FINNHUB_API_KEY"  # finnhub.io
  
  # Financial Data APIs
  alpha_vantage_api_key: "YOUR_ALPHA_VANTAGE_KEY"  # alphavantage.co
  polygon_api_key: "YOUR_POLYGON_API_KEY"  # polygon.io
  
  # Social Media APIs
  twitter_bearer_token: "YOUR_TWITTER_BEARER_TOKEN"
  
  # Economic Data
  fred_api_key: "YOUR_FRED_API_KEY"  # fred.stlouisfed.org
  
  # Alternative Data
  alternative_api_key: "YOUR_ALTERNATIVE_DATA_KEY"

# Trading Platform Configuration
broker:
  alpaca:
    api_key: "YOUR_ALPACA_API_KEY"
    api_secret: "YOUR_ALPACA_SECRET"
    base_url: "https://paper-api.alpaca.markets"  # Use live for real trading
    
  interactive_brokers:
    host: "127.0.0.1"
    port: 7497
    client_id: 1
    
  # Add more brokers as needed
  enabled_brokers: ["alpaca"]

# Trading Parameters
trading:
  # Mode: paper, live
  mode: "paper"
  
  # Default symbols to trade
  watchlist: ["AAPL", "GOOGL", "MSFT", "AMZN", "TSLA"]
  
  # Trading hours (24h format)
  trading_hours:
    start: "09:30"
    end: "16:00"
    timezone: "America/New_York"
  
  # Position sizing
  max_position_size: 0.1  # 10% of portfolio per position
  max_total_exposure: 0.8  # 80% max portfolio exposure
  
  # Auto-trading
  autonomous_trading: true
  min_confidence_threshold: 0.75

# Risk Management
risk_management:
  # Stop loss and take profit
  default_stop_loss: 0.02  # 2%
  default_take_profit: 0.04  # 4%
  
  # Maximum loss limits
  max_daily_loss: 0.05  # 5%
  max_weekly_loss: 0.10  # 10%
  max_drawdown: 0.15  # 15%
  
  # Position limits
  max_open_positions: 10
  min_trade_size: 100  # Minimum dollar amount
  
  # Circuit breakers
  enable_circuit_breaker: true
  circuit_breaker_threshold: 0.03  # Pause if 3% loss in a day

# AI/ML Configuration
ai:
  # Model settings
  sentiment_model: "distilbert-base-uncased-finetuned-sst-2-english"
  pattern_model: "auto"  # Auto-select based on data
  
  # Analysis weights
  analysis_weights:
    technical: 0.25
    fundamental: 0.20
    sentiment: 0.25
    macro: 0.15
    news: 0.15
  
  # Prediction settings
  prediction_horizon: 60  # minutes
  lookback_period: 1440  # minutes (1 day)
  
  # Confidence thresholds
  min_prediction_confidence: 0.70
  high_confidence_threshold: 0.85

# Data Sources Configuration
data:
  # Update frequencies (in minutes)
  update_frequencies:
    price: 1
    news: 5
    sentiment: 15
    macro: 60
    
  # Data retention (in days)
  retention:
    price_data: 365
    news_data: 90
    trade_history: 730
    
  # Sources to use
  enabled_sources:
    - "yahoo_finance"
    - "finnhub"
    - "news_api"
    - "fred"
    - "twitter"

# Logging & Notifications
logging:
  level: "INFO"
  log_file: "logs/trading_bot.log"
  
  # Notification settings
  notifications:
    enabled: true
    telegram_bot_token: "YOUR_TELEGRAM_TOKEN"
    telegram_chat_id: "YOUR_CHAT_ID"
    email_alerts: false
    email_smtp_server: "smtp.gmail.com"
    email_recipients: []

# Dashboard
dashboard:
  host: "0.0.0.0"
  port: 8050
  debug: false
  
# Feature Flags
features:
  options_trading: false
  crypto_trading: false
  forex_trading: false
  futures_trading: false
  
  # Advanced features
  mean_reversion: true
  momentum: true
  breakout: true
  pairs_trading: false
  
  # ML features
  reinforcement_learning: false
  transformer_models: true
  ensemble_learning: true